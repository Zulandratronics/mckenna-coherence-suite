name: CI — McKenna Coherence Suite

on:
  push:
    branches: [main, master]
    paths:
      - "mckenna/**"
      - "apps/mckenna-suite/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest suite
        run: pytest

      - name: Verify CLI scanner smoke test
        run: |
          echo "Coherent local engineering summary without boundary leaks." | mckenna-scan --json

      - name: Validate JSON plugin & MCP manifests
        run: |
          python -c "import json; json.load(open('apps/mckenna-suite/plugin.json')); json.load(open('apps/mckenna-suite/mcp_config.json')); print('Manifests valid.')"
